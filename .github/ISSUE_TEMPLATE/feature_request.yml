name: 功能建议
description: 建议新增控件、主题能力或 Gallery 功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先查阅 [docs/02 控件映射](https://github.com/lishuangquan1987/mygo-antdesign/blob/main/docs/02-widget-mapping.md) 与 [docs/03 缺口控件](https://github.com/lishuangquan1987/mygo-antdesign/blob/main/docs/03-gap-widgets.md)，确认是否已在规划中。
  - type: dropdown
    id: area
    attributes:
      label: 领域
      options:
        - 控件（widgets/）
        - 缺口控件（extra/）
        - 主题 / 密度
        - 图标
        - Gallery / 示例
        - 文档 / 构建
        - 其他
    validations:
      required: true
  - type: input
    id: antd
    attributes:
      label: 对应的 antd 组件（如有）
      placeholder: 例如 Tooltip / Watermark / Splitter
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与动机
      description: 解决什么问题？为什么现有控件不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的 API / 行为
      description: 可给出函数签名、选项或交互草图
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
