# 发布构建：为 Gallery 示例程序生成各平台安装包，并上传到 GitHub Release。
#
# 触发方式：
#   1. Release 发布（published）→ 自动构建并上传到该 Release 的附件。
#   2. 手动触发（workflow_dispatch）→ 填入已存在的 tag，构建后上传到对应 Release。
#
# 产物：mygo-ant-design-gallery-<版本>-<系统>-<架构>.{zip,tar.gz}
#   - zip：Windows / macOS
#   - tar.gz：Linux
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布到的 tag（例如 v0.3.0），必须已存在对应的 Release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  APP_NAME: mygo-ant-design-gallery

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: darwin
            goarch: amd64
            archive: zip
          - goos: darwin
            goarch: arm64
            archive: zip
    steps:
      - name: 解析发布 tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${INPUT_TAG:-}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::无法确定发布 tag：release 事件缺少 tag_name，手动触发请填写 tag"
            exit 1
          fi
          # 去掉前缀 v，便于拼装文件名（v0.3.0 -> 0.3.0）。
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验 Release 存在
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $TAG 不存在。请先在 GitHub 上创建该 tag 的 Release，或使用已有 tag。"
            exit 1
          fi

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${APP_NAME}${suffix}" ./gallery
          ls -l dist

      - name: 打包
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          out="${APP_NAME}-${VERSION}-${GOOS}-${GOARCH}"
          pkg="dist/${out}"
          mkdir -p "$pkg"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          cp "dist/${APP_NAME}${suffix}" "$pkg/"
          cp README.md LICENSE "$pkg/" 2>/dev/null || true
          cat > "$pkg/RUN.txt" <<EOF
          mygo-antdesign Gallery ${VERSION}
          Ant Design 风格的 MyGo 原生 UI 控件库 · 示例程序

          运行方式：
            Windows: 双击 ${APP_NAME}.exe
            macOS:   chmod +x ${APP_NAME} && ./${APP_NAME}
            Linux:   chmod +x ${APP_NAME} && ./${APP_NAME}

          说明：
            - 纯 Go 构建，无 cgo 依赖；需要桌面环境（Windows 10+/macOS 11+/X11 或 Wayland）。
            - 仓库：https://github.com/lishuangquan1987/mygo-antdesign
            - 文档：https://github.com/lishuangquan1987/mygo-antdesign/tree/main/docs
          EOF
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip -q -r "${out}.zip" "${out}")
          else
            tar -czf "dist/${out}.tar.gz" -C dist "${out}"
          fi
          echo "ARCHIVE_PATH=dist/${out}.${ARCHIVE}" >> "$GITHUB_ENV"
          ls -lh "dist/${out}.${ARCHIVE}"

      - name: 上传构建产物（Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE_PATH" \
            --repo "${{ github.repository }}" --clobber
          echo "- 已上传 \`$(basename "$ARCHIVE_PATH")\`" >> "$GITHUB_STEP_SUMMARY"
