name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.27.4"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: gofmt 检查
        run: |
          set -euo pipefail
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 构建全部包与 Gallery
        run: |
          set -euo pipefail
          go build ./...
          go build -trimpath -o /tmp/gallery ./gallery
          ls -l /tmp/gallery

      - name: 单元测试（含截图基线）
        run: go test -count=1 ./...

      - name: 样式铁律静态检查
        run: go run ./internal/check

  cross-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 跨平台构建
        run: go build ./...

      - name: go vet
        run: go vet ./...
